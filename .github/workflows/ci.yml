name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automation
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: automation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U automation -d automation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
        env:
          TEST_DATABASE_URL: postgresql://automation:ci-test-only@localhost:5432/automation_test
      - name: Audit locked Python dependencies
        run: uvx pip-audit==2.10.1 --path .venv/lib/python${{ matrix.python }}/site-packages --strict --progress-spinner off
  containers:
    name: Clean-install Docker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: python3 tools/selftest.py --full
