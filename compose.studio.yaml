# Optional console for an existing backend. No database, tenant or provider defaults.
services:
  studio:
    image: ${STUDIO_IMAGE:-jira-relay-studio:1.0.0}
    build: {context: ., dockerfile: frontend/Dockerfile}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: 8080
      STUDIO_BACKEND_URL: ${STUDIO_BACKEND_URL:?Set the backend URL reachable from the console}
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:?Set the console browser origin}
      STUDIO_BACKEND_TOKEN_FILE: /run/secrets/studio_backend_token
      STUDIO_LOGIN_USERNAME: ${STUDIO_LOGIN_USERNAME:?Set the console login username}
      STUDIO_LOGIN_PASSWORD_FILE: /run/secrets/studio_login_password
    secrets: [studio_backend_token, studio_login_password]
    ports: ["${STUDIO_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PUBLISHED_PORT:-8093}:8080"]
secrets:
  studio_backend_token:
    file: ${STUDIO_BACKEND_TOKEN_FILE:?Set the host path to the backend token file}
  studio_login_password:
    file: ${STUDIO_LOGIN_PASSWORD_FILE:?Set the host path to the console password file}
