# Portable installation; PostgreSQL is supplied by the operator.
# Use compose.dev.yaml explicitly for the disposable development database.
x-runtime: &runtime
  image: ${AUTOMATION_IMAGE:-automation-api:1.0.0}
  build: .
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
  stop_grace_period: 150s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-database: &database
  DB_HOST: ${DB_HOST:?Set DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_USER: ${DB_USER:?Set the runtime DB_USER}
  DB_PASSWORD_FILE: /run/secrets/db_runtime_password

x-environment: &environment
  <<: *database
  TENANT_ID: ${TENANT_ID:?Set a stable TENANT_ID for this installation}
  BITBUCKET_ACCOUNT_EMAIL: ${BITBUCKET_ACCOUNT_EMAIL:-}
  BITBUCKET_API_TOKEN_FILE: /run/secrets/bitbucket_api_token
  JIRA_API_TOKEN_FILE: /run/secrets/jira_api_token
  JIRA_CLOUD_ID: ${JIRA_CLOUD_ID:-}
  JIRA_MAX_DAILY_WRITES: ${JIRA_MAX_DAILY_WRITES:-100}
  BITBUCKET_MAX_DAILY_WRITES: ${BITBUCKET_MAX_DAILY_WRITES:-100}
  MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}

services:
  studio:
    <<: *runtime
    profiles: [studio]
    image: ${STUDIO_IMAGE:-jira-relay-studio:1.0.0}
    build: {context: ., dockerfile: frontend/Dockerfile}
    stop_grace_period: 35s
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: 8080
      STUDIO_BACKEND_URL: ${STUDIO_BACKEND_URL:-http://api:8080}
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-http://127.0.0.1:8093}
      STUDIO_BACKEND_TOKEN_FILE: /run/secrets/gui_api_token
      STUDIO_LOGIN_USERNAME: ${STUDIO_LOGIN_USERNAME:-operator}
      STUDIO_LOGIN_PASSWORD_FILE: /run/secrets/studio_login_password
    secrets: [gui_api_token, studio_login_password]
    ports: ["${STUDIO_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PUBLISHED_PORT:-8093}:8080"]
    depends_on: {api: {condition: service_healthy}}
  migrate:
    <<: *runtime
    restart: "no"
    command: [python, -m, app.migrate]
    environment:
      <<: *database
      TENANT_ID: ${TENANT_ID:?Set TENANT_ID}
      DB_USER: ${DB_MIGRATION_USER:?Set DB_MIGRATION_USER}
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets: [db_migrator_password]
    healthcheck: {disable: true}
  api:
    <<: *runtime
    environment:
      <<: *environment
      ADMIN_BOOTSTRAP_TOKEN_FILE: /run/secrets/admin_bootstrap_token
      JIRA_WEBHOOK_SECRET_FILE: /run/secrets/jira_webhook_secret
      AUTH_ROTATION_TTL_SECONDS: ${AUTH_ROTATION_TTL_SECONDS:-3600}
    secrets: [db_runtime_password, admin_bootstrap_token, jira_webhook_secret, bitbucket_api_token, jira_api_token]
    ports: ["127.0.0.1:${API_PORT:-8088}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.health, api]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *runtime
    command: [python, -m, app.worker]
    environment: *environment
    secrets: [db_runtime_password, bitbucket_api_token, jira_api_token]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.health, worker]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

secrets:
  gui_api_token:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/gui_api_token
  studio_login_password:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/studio_login_password
  db_runtime_password:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/db_runtime_password
  db_migrator_password:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/db_migrator_password
  admin_bootstrap_token:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/admin_bootstrap_token
  jira_webhook_secret:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/jira_webhook_secret
  bitbucket_api_token:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/bitbucket_api_token
  jira_api_token:
    file: ${AUTOMATION_SECRETS_DIR:-./secrets}/jira_api_token
