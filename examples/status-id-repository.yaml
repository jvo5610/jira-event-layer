apiVersion: automation/v1
kind: Rule
name: jira-repository-request
description: Solicitud aprobada por IDs estables dispara el pipeline de aprovisionamiento.
trigger:
  source: jira
  event: jira:issue_updated
when:
  all:
    - {path: payload.issue.fields.project.key, op: eq, value: KAN}
    - {path: payload.issue.fields.labels, op: contains, value: automation-lab-repository}
    - some:
        path: payload.changelog.items
        where:
          all:
            - {path: field, op: eq, value: status}
            # En curso -> Finalizado, matched by stable IDs rather than labels.
            - {path: from, op: eq, value: "10001"}
            - {path: to, op: eq, value: "10003"}
actions:
  - type: bitbucket.pipeline
    workspace: jvidelaolmos
    repository: jira-event-layer-lab
    branch: master
    pipeline: setup-new-repository
    variables:
      PROJECT_KEY: KAN
      REPOSITORY_NAME: "${payload.issue.key}"
      DESCRIPTION: "${payload.issue.fields.summary}"
      LANGUAGE: python
      DEFAULT_REVIEWERS: ""
      AWS_ACCOUNT_ID: ""
      JIRA_ISSUE_KEY: "${payload.issue.key}"
