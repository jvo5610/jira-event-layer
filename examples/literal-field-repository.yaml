# "repository.name" is one literal object key from the incoming Jira payload.
apiVersion: automation/v1
kind: Rule
name: repositorio-desde-campo-literal
description: Extract a literal key and array element into a NO-OP pipeline input.
trigger: {source: jira, event: "jira:issue_updated"}
when:
  all:
    - {path: issue.fields.project.key, op: eq, value: KAN}
    - {path: issue.fields.labels, op: contains, value: automation-lab-repository}
    - path: 'issue.fields["repository.name"][0].value'
      op: exists
actions:
  - type: bitbucket.pipeline
    workspace: jvidelaolmos
    repository: jira-event-layer-lab
    branch: master
    pipeline: setup-new-repository
    variables:
      PROJECT_KEY: KAN
      REPOSITORY_NAME: '${issue.fields["repository.name"][0].value}'
      DESCRIPTION: "${issue.fields.summary}"
      LANGUAGE: python
      DEFAULT_REVIEWERS: ""
      AWS_ACCOUNT_ID: ""
      JIRA_ISSUE_KEY: "${issue.key}"
