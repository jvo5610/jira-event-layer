# Flujo operativo para el proyecto KAN y sus IDs de tipo/estado verificados.
apiVersion: automation/v1
kind: Rule
name: crear-ticket-por-cierre
# Los tickets creados reciben automation-flujo-crear-ticket-por-cierre.
# La versión y ejecución van en automation.operation, no en etiquetas.
description: Crea, comenta, edita, transiciona y clona una tarjeta al aprobar una solicitud KAN.
trigger: {source: jira, event: "jira:issue_updated"}
when:
  all:
    - {path: issue.fields.project.key, op: eq, value: KAN}
    - {path: issue.fields.labels, op: contains, value: automation-lab-repository}
    - some:
        path: changelog.items
        where:
          all:
            - {path: field, op: eq, value: status}
            - {path: from, op: eq, value: "10001"}
            - {path: to, op: eq, value: "10003"}
actions:
  - type: jira.issue.get
    issue: "${issue.key}"
    require: {path: fields.status.id, op: eq, value: "10003"}
  - type: jira.issue.create
    project: KAN
    issue_type_id: "10003"
    fields:
      summary: "[Automation example] Ticket creado por el motor"
      description: "${issue.fields.summary}"
  - type: jira.comment.add
    issue: '${_steps["1"].key}'
    text: "Ticket creado a partir del cierre de la solicitud de laboratorio."
  - type: jira.issue.edit
    issue: '${_steps["1"].key}'
    fields:
      summary: "[Automation example] Ticket actualizado por el motor"
  - type: jira.issue.transition
    issue: '${_steps["1"].key}'
    from_status_id: "10000"
    to_status_id: "10001"
  - type: jira.issue.clone
    source: '${_steps["1"].key}'
    project: KAN
    issue_type_id: "10003"
    copy_fields: [summary, description]
    fields:
      summary: "[Automation example] Copia controlada del ticket"
  - type: jira.issue.link
    inward: '${_steps["1"].key}'
    outward: '${_steps["5"].key}'
    link_type_id: "10000"
  - type: jira.issue.get
    issue: '${_steps["1"].key}'
    require: {path: fields.status.id, op: eq, value: "10001"}
  - type: jira.issue.transition
    issue: '${_steps["5"].key}'
    to_status_id: "10001"
  - type: jira.issue.get
    issue: '${_steps["5"].key}'
    require: {path: fields.status.id, op: eq, value: "10001"}
