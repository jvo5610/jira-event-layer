apiVersion: automation/v1
kind: Rule
name: jira-repository-request
description: Una solicitud aprobada en Jira dispara el pipeline de aprovisionamiento.
trigger:
  source: jira
  event: jira:issue_updated
when:
  all:
    - path: payload.issue.fields.project.key
      op: eq
      value: KAN
    - path: payload.issue.fields.labels
      op: contains
      value: automation-lab-repository
    - some:
        path: payload.changelog.items
        where:
          all:
            - {path: field, op: eq, value: status}
            - {path: fromString, op: eq, value: In Progress}
            - {path: toString, op: eq, value: Done}
actions:
  - type: bitbucket.pipeline
    workspace: jvidelaolmos
    repository: jira-event-layer-lab
    branch: master
    pipeline: setup-new-repository
    variables:
      PROJECT_KEY: KAN
      REPOSITORY_NAME: "${payload.issue.key}"
      DESCRIPTION: "${payload.issue.fields.summary}"
      LANGUAGE: python
      DEFAULT_REVIEWERS: ""
      AWS_ACCOUNT_ID: ""
      JIRA_ISSUE_KEY: "${payload.issue.key}"
