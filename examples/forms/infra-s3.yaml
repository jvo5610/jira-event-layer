apiVersion: automation/v1
kind: Rule
name: forms-infra-s3
description: Derivar S3 a Infra dentro de DEMO.
trigger:
  source: jira
  event: jira:issue_created
when:
  all:
  - path: payload.issue.fields.project.key
    op: eq
    value: DEMO
  - path: payload.issue.fields.issuetype.id
    op: eq
    value: '10001'
  - path: payload.issue.fields.customfield_10010.requestType.id
    op: eq
    value: '10000'
  - path: enrichment_status
    op: eq
    value: completed
  - path: enrichment.forms[0].formTemplate.id
    op: eq
    value: 11111111-1111-4111-8111-111111111111
  - path: enrichment.forms[0].submitted
    op: eq
    value: true
  - path: enrichment.forms[0].answers.recursos
    op: contains
    value: S3
  - any:
    - path: enrichment.forms[0].answers.s3_more
      op: eq
      value: 'No'
    - path: enrichment.forms[0].answers.s3_more
      op: exists
      value: false
  - all:
    - path: enrichment.forms[0].answers.s3_name
      op: exists
      value: true
    - path: enrichment.forms[0].answers.s3_name
      op: ne
      value: null
    - path: enrichment.forms[0].answers.s3_name
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.s3_why
      op: exists
      value: true
    - path: enrichment.forms[0].answers.s3_why
      op: ne
      value: null
    - path: enrichment.forms[0].answers.s3_why
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.aws_account
      op: exists
      value: true
    - path: enrichment.forms[0].answers.aws_account
      op: ne
      value: null
    - path: enrichment.forms[0].answers.aws_account
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.s3_read_who
      op: exists
      value: true
    - path: enrichment.forms[0].answers.s3_read_who
      op: ne
      value: null
    - path: enrichment.forms[0].answers.s3_read_who
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.s3_write_who
      op: exists
      value: true
    - path: enrichment.forms[0].answers.s3_write_who
      op: ne
      value: null
    - path: enrichment.forms[0].answers.s3_write_who
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.descripcion
      op: exists
      value: true
    - path: enrichment.forms[0].answers.descripcion
      op: ne
      value: null
    - path: enrichment.forms[0].answers.descripcion
      op: ne
      value: ''
  - all:
    - path: enrichment.forms[0].answers.linea
      op: exists
      value: true
    - path: enrichment.forms[0].answers.linea
      op: ne
      value: null
    - path: enrichment.forms[0].answers.linea
      op: ne
      value: ''
actions:
- type: jira.issue.get
  issue: ${payload.issue.key}
  require:
    all:
    - path: fields.project.key
      op: eq
      value: DEMO
    - path: fields.issuetype.id
      op: eq
      value: '10001'
- type: jira.issue.create
  project: DEMO
  issue_type_id: '10002'
  fields:
    summary: Crear bucket S3 ${enrichment.forms[0].answers.s3_name}
    description: |
      Descripción general
      ${enrichment.forms[0].answers.descripcion}

      Línea: ${enrichment.forms[0].answers.linea}

      Solicitud de bucket S3
      Finalidad del bucket: ${enrichment.forms[0].answers.s3_why}
      Nombre del bucket: ${enrichment.forms[0].answers.s3_name}
      Cuenta AWS del bucket: ${enrichment.forms[0].answers.aws_account}
      Lectura solicitada para: ${enrichment.forms[0].answers.s3_read_who}
      Escritura solicitada para: ${enrichment.forms[0].answers.s3_write_who}

      Otra información
      Escalado desde: ${payload.issue.key} — ${payload.issue.fields.summary}
      https://jira.example.com/browse/${payload.issue.key}
    labels:
    - infra
    - s3
    - jira-relay-test
- type: jira.issue.link
  inward: ${payload.issue.key}
  outward: ${_steps["1"].key}
  link_type_id: '10003'
