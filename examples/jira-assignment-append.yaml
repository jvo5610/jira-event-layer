apiVersion: automation/v1
kind: Rule
name: nuevo-flujo
description: Agrega un párrafo al asignar o reasignar un ticket de KAN a una persona.
trigger:
  source: jira
  event: jira:issue_updated
when:
  all:
    - path: issue.fields.project.key
      op: eq
      value: KAN
    - some:
        path: changelog.items
        where:
          all:
            - path: fieldId
              op: eq
              value: assignee
            - path: to
              op: exists
              value: true
            - path: to
              op: ne
              value: null
            - path: to
              op: ne
              value: ""
actions:
  - type: jira.issue.edit
    issue:
      path: issue.key
    append_description:
      value: Se asigno!
